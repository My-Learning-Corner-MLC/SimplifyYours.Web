<app-site-header />
<main>
  <router-outlet />
</main>
<p-toast />
<p-toast key="session-expired">
  <ng-template pTemplate="message" let-message>
    <div class="sy-session-expired-toast">
      <div class="sy-session-expired-toast__summary">{{ message.summary }}</div>
      <div class="sy-session-expired-toast__detail">{{ message.detail }}</div>
      @if (message.data?.action === 'sign-in') {
        <button
          type="button"
          class="sy-session-expired-toast__action"
          (click)="onSignInClick()"
        >
          Sign In
        </button>
      }
    </div>
  </ng-template>
</p-toast>
