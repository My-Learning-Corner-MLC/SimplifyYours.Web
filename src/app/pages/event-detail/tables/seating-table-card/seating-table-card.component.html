<article
  class="table-card"
  data-testid="table-card"
  [class.table-card--receiving]="receivingDrop()"
  [attr.aria-label]="table().name"
>
  <header class="table-card__head">
    <span class="table-card__name">{{ table().name }}</span>
    @if (table().isFull) {
      <span class="table-card__full-badge">Full</span>
    }
  </header>

  <div
    class="table-card__ring"
    [class.table-card__ring--round]="table().shape === 'Round'"
    [class.table-card__ring--long]="table().shape === 'Long'"
    [class.table-card__ring--square]="table().shape === 'Square'"
  >
    <span class="table-card__surface" aria-hidden="true">{{ table().shape }}</span>
    @for (seatVm of seats(); track seatVm.seat.seatIndex) {
      <span
        class="table-card__seat-slot"
        cdkDropList
        [id]="seatVm.dropListId"
        [cdkDropListData]="seatVm.seat"
        [cdkDropListEnterPredicate]="seatEnterPredicate"
        (cdkDropListDropped)="onSeatDropped($event, seatVm.seat.seatIndex)"
        (cdkDropListEntered)="onSeatEnter()"
        (cdkDropListExited)="onSeatExit()"
        [style.left.%]="seatVm.xPercent"
        [style.top.%]="seatVm.yPercent"
      >
        <button
          type="button"
          class="table-card__seat"
          [class.table-card__seat--filled]="seatVm.seat.guestId !== null"
          [class.table-card__seat--targetable]="assigningGuestId() && seatVm.seat.guestId === null"
          [ngStyle]="seatVm.tint ? { background: seatVm.tint, 'border-color': seatVm.tint } : {}"
          cdkDrag
          [cdkDragDisabled]="seatVm.seat.guestId === null"
          [cdkDragData]="seatVm.seat.guestId"
          [attr.aria-label]="seatLabel(seatVm.seat)"
          [attr.title]="seatVm.seat.guestName ?? 'Empty seat'"
          (click)="onSeatClick(seatVm.seat)"
        >
          {{ seatVm.seat.guestId !== null ? seatVm.initial : '+' }}
        </button>
      </span>
    }
  </div>

  <footer class="table-card__foot">
    <span class="table-card__tally">{{ seatedCount() }} / {{ table().seatCount }} seated</span>
    @if (receivingDrop()) {
      <span class="table-card__drop-hint" aria-hidden="true">DROP TO SEAT</span>
    } @else {
      <div class="table-card__actions" role="group" [attr.aria-label]="'Actions for ' + table().name">
        <button
          type="button"
          class="table-card__action-btn"
          title="Edit table"
          [attr.aria-label]="'Edit ' + table().name"
          (click)="editTable.emit()"
        >&#9998;</button>
        <button
          type="button"
          class="table-card__action-btn"
          [title]="table().isFull ? 'Mark as not full' : 'Mark as full'"
          [attr.aria-label]="(table().isFull ? 'Mark as not full: ' : 'Mark as full: ') + table().name"
          (click)="markFull.emit()"
        >&#10003;</button>
        <button
          type="button"
          class="table-card__action-btn table-card__action-btn--danger"
          title="Delete table"
          [attr.aria-label]="'Delete ' + table().name"
          (click)="deleteTable.emit()"
        >&#9003;</button>
      </div>
    }
  </footer>
</article>
