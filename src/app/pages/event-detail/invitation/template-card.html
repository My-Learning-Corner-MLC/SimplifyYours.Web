<button
  type="button"
  class="template-card"
  [class.template-card--selected]="selected()"
  (click)="onActivate()"
>
  <span class="template-card__face" [style.background]="faceBackground()" [style.--face-accent]="accent()" aria-hidden="true">
    <span class="template-card__face-frame"></span>
    <span class="template-card__face-label">{{ eventTypeLabel() }}</span>
    <span class="template-card__face-motif">
      @switch (motif()) {
        @case ('rings') {
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6">
            <circle cx="9" cy="14" r="5.2"></circle>
            <circle cx="15" cy="14" r="5.2"></circle>
          </svg>
        }
        @case ('balloon') {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="9" rx="6" ry="7"></ellipse>
            <path d="M12 16v6"></path>
            <path d="M9 22h6"></path>
          </svg>
        }
        @case ('toast') {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l1 8a3 3 0 0 0 3 3v7"></path>
            <path d="M18 3l-1 8a3 3 0 0 1-3 3v7"></path>
            <path d="M7 21h3"></path>
            <path d="M14 21h3"></path>
          </svg>
        }
        @case ('rocket') {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c3 2 5 6 5 10 0 2-1 4-2 5l-3 3-3-3c-1-1-2-3-2-5 0-4 2-8 5-10z"></path>
            <circle cx="12" cy="10" r="1.6"></circle>
            <path d="M9 17l-2 4"></path>
            <path d="M15 17l2 4"></path>
          </svg>
        }
        @case ('plate') {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="3.4"></circle>
          </svg>
        }
        @default {
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" [attr.stroke]="accent()" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l1.8 5.6L19.5 9l-5.7 1.4L12 16l-1.8-5.6L4.5 9l5.7-1.4z"></path>
          </svg>
        }
      }
    </span>
    <span class="template-card__face-rule"></span>
  </span>

  @if (selected()) {
    <span class="template-card__badge" aria-hidden="true">✓</span>
  }

  <span class="template-card__footer">
    <span class="template-card__name">{{ template().name }}</span>
    @if (selected()) {
      <span class="template-card__selected-label">Selected</span>
    } @else {
      <span class="template-card__arrow" aria-hidden="true">→</span>
    }
  </span>
</button>
