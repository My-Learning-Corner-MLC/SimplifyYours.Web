<div class="confirm-dialog__scrim" aria-hidden="true"></div>

<div
  class="confirm-dialog"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-label]="ariaLabel() ?? heading()"
  aria-describedby="confirm-dialog-body"
  (keydown.escape)="onCancel()"
>
  <h2 #headingEl class="confirm-dialog__heading" tabindex="-1">
    @if (warning()) {
      <span class="confirm-dialog__icon" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C28840" stroke-width="2.6" stroke-linecap="round">
          <line x1="12" y1="8" x2="12" y2="13"></line>
          <circle cx="12" cy="16.5" r="0.9" fill="#C28840" stroke="none"></circle>
          <circle cx="12" cy="12" r="9"></circle>
        </svg>
      </span>
    }
    {{ heading() }}
  </h2>

  <div class="confirm-dialog__body" id="confirm-dialog-body">
    <ng-content></ng-content>
  </div>

  <div class="confirm-dialog__actions">
    <button
      type="button"
      class="confirm-dialog__secondary"
      [class.confirm-dialog__secondary--solid]="danger()"
      (click)="onCancel()"
    >
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      class="confirm-dialog__primary"
      [class.confirm-dialog__primary--outline]="danger()"
      [disabled]="primaryDisabled()"
      (click)="onConfirm()"
    >
      {{ primaryLabel() }}
    </button>
  </div>
</div>
