<div class="confirm-dialog__scrim" aria-hidden="true"></div>

<div
  class="confirm-dialog"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-label]="ariaLabel() ?? heading()"
  aria-describedby="confirm-dialog-body"
  (keydown.escape)="onCancel()"
>
  <h2 #headingEl class="confirm-dialog__heading" tabindex="-1">
    @if (warning()) {
      <span class="confirm-dialog__icon" aria-hidden="true">⚠️</span>
    }
    {{ heading() }}
  </h2>

  <div class="confirm-dialog__body" id="confirm-dialog-body">
    <ng-content></ng-content>
  </div>

  <div class="confirm-dialog__actions">
    <button type="button" class="confirm-dialog__secondary" (click)="onCancel()">{{ cancelLabel() }}</button>
    <button
      type="button"
      class="confirm-dialog__primary"
      [disabled]="primaryDisabled()"
      (click)="onConfirm()"
    >
      {{ primaryLabel() }}
    </button>
  </div>
</div>
