server {
    listen 80;
    server_name local.simplifyyours.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name local.simplifyyours.com;

    ssl_certificate     /certs/frontend.pem;
    ssl_certificate_key /certs/frontend-key.pem;

    # Docker's embedded DNS -- re-resolve api-gateway periodically instead of
    # caching its IP for the container's lifetime, so a gateway restart
    # (which gets a new IP) doesn't leave this proxy pointed at a dead address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway_upstream https://api-gateway:8081;
        proxy_pass $gateway_upstream$request_uri;

        # api-gateway presents a cert issued by the same local mkcert CA as
        # every other container in the stack -- validated for real, not
        # bypassed, same as container-to-container calls elsewhere.
        proxy_ssl_trusted_certificate /certs/rootCA.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name api-gateway;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
